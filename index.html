<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<meta name=theme-color content="#000">
<title>Camera</title>
<link rel=manifest href=manifest.json>
<link rel=apple-touch-icon href=icon192.png>
<meta name=mobile-web-app-capable content=yes>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;height:100svh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#top{display:flex;justify-content:space-around;align-items:center;height:56px;font-size:20px;opacity:.95}
#pv{position:relative;width:100vw;aspect-ratio:3/4}
canvas{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
#fx{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;pointer-events:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#tm,#z{z-index:2}
#z{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0006;border-radius:30px;padding:4px}
#z b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500}
#z b.on{background:#0009;color:#fd0;width:42px;height:42px;font-size:13px}
#m{display:flex;justify-content:center;gap:22px;font-size:14px;font-weight:600;margin:18px 0 auto;color:#ccc}
#m .on{color:#fff;background:#fff3;padding:5px 14px;border-radius:20px;margin:-5px 0}
#b{display:flex;justify-content:space-between;align-items:center;padding:0 34px 34px}
#g{width:48px;height:48px;border-radius:50%;background:#333 center/cover;border:2px solid #fff3}
#s{width:76px;height:76px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px #000,0 0 0 7px #fff}
#s:active{transform:scale(.92)}
#f{width:48px;height:48px;border-radius:50%;background:#fff2;border:0;color:#fff;font-size:24px}
</style>

<div id=top>
  <span>⚙︎</span><span>ϟ</span><span>◷</span>
  <span style="font-size:13px;border:1.5px solid #fff;border-radius:4px;padding:1px 4px">3:4</span>
  <span>✦</span>
</div>
<div id=pv>
  <video id=v playsinline muted></video>
  <canvas id=fx></canvas>
  <canvas id=c></canvas>
  <div id=tm style="position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#e22;padding:3px 10px;border-radius:12px;font-size:14px;display:none"></div>
  <div id=z><b>.6</b><b class=on>1x</b><b>3</b></div>
</div>
<div id=m>
  <span>MORE</span><span>PORTRAIT</span><span class=on>PHOTO</span><span>VIDEO</span>
</div>
<div id=b>
  <div id=g></div>
  <button id=s></button>
  <button id=f>⟲</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const v = document.getElementById('v');
const c = document.getElementById('c');
const fcam = document.getElementById('fx');
const gl = c.getContext('webgl', {preserveDrawingBuffer: true});

let m, face = 'environment', bears = [], st, last, mode = 'PHOTO', rec, ext = 'jpg', ti, texW = 0, texH = 0;

async function cam() {
  st && st.getTracks().forEach(t => t.stop());
  v.srcObject = null;
  bears = [];
  const gu = q => navigator.mediaDevices.getUserMedia({video: q});
  try {
    st = await gu({facingMode: {exact: face}, width: {ideal: 1280}, height: {ideal: 960}});
  } catch (e) {
    await new Promise(r => setTimeout(r, 400));
    st = await gu({facingMode: face, width: {ideal: 1280}, height: {ideal: 960}});
  }
  v.srcObject = st;
  v.style.transform = face === 'user' ? 'scaleX(-1)' : '';
  await v.play();
  c.width = v.videoWidth;
  c.height = v.videoHeight;
}

let sw = 0, dbg = 0;
document.querySelector('#top span:nth-child(4)').onclick = e => {
  dbg = !dbg;
  e.target.style.background = dbg ? '#fd0' : '';
};

f.onclick = async () => {
  if (sw) return;
  sw = 1;
  f.style.opacity = .4;
  const old = face;
  face = face === 'user' ? 'environment' : 'user';
  try {
    await cam();
  } catch (e) {
    face = old;
    console.error('Could not switch camera', e);
    try { await cam(); } catch (restoreError) {
      console.error('Could not restore camera', restoreError);
    }
  } finally {
    sw = 0;
    f.style.opacity = 1;
  }
};

z.onclick = e => {
  if (e.target.tagName === 'B') {
    z.querySelector('.on').className = '';
    e.target.className = 'on';
  }
};

const M = document.getElementById('m');
M.onclick = e => {
  const t = e.target.textContent;
  if (rec || !/PHOTO|VIDEO/.test(t)) return;
  mode = t;
  M.querySelector('.on').className = '';
  e.target.className = 'on';
  s.style.background = t === 'VIDEO' ? '#e33' : '#fff';
};

const thumb = () => g.style.backgroundImage = `url(${c.toDataURL('image/jpeg', .5)})`;

s.onclick = async () => {
  if (mode === 'PHOTO') {
    last = c.toDataURL('image/jpeg', .92);
    ext = 'jpg';
    thumb();
    c.style.opacity = 0;
    setTimeout(() => c.style.opacity = 1, 80);
    return;
  }
  if (rec) {
    rec.stop();
    rec = null;
    s.style.borderRadius = '50%';
    s.style.transform = '';
    tm.style.display = 'none';
    clearInterval(ti);
    return;
  }
  const ms = c.captureStream(30);
  const au = await navigator.mediaDevices.getUserMedia({audio: true}).catch(() => null);
  au && au.getTracks().forEach(t => ms.addTrack(t));
  const mt = ['video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const ch = [];
  const r = rec = new MediaRecorder(ms, {mimeType: mt});
  r.ondataavailable = e => ch.push(e.data);
  r.onstop = () => {
    au && au.getTracks().forEach(t => t.stop());
    last = URL.createObjectURL(new Blob(ch, {type: mt}));
    ext = mt.slice(6);
    thumb();
  };
  r.start();
  s.style.borderRadius = '22px';
  s.style.transform = 'scale(.7)';
  const t0 = Date.now();
  tm.style.display = 'block';
  tm.textContent = '00:00';
  ti = setInterval(() => {
    const q = (Date.now() - t0) / 1e3 | 0;
    tm.textContent = String(q / 60 | 0).padStart(2, 0) + ':' + String(q % 60).padStart(2, 0);
  }, 500);
};

g.onclick = () => {
  if (!last) return;
  const a = document.createElement('a');
  a.download = (ext === 'jpg' ? 'IMG_' : 'VID_') + Date.now() + '.' + ext;
  a.href = last;
  a.click();
};

const plushAnimalClasses = new Set([
  'teddy bear', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow',
  'elephant', 'bear', 'zebra', 'giraffe'
]);

async function detect() {
  try {
    if (m && v.readyState > 1) {
      const now = performance.now();
      const used = new Set();
  const d = (await m.detect(v, 10, 0.25))
  .filter(p => plushAnimalClasses.has(p.class))
  .filter(p => {
    const area = p.bbox[2] * p.bbox[3];
    return area > 3500 && area < v.videoWidth * v.videoHeight * 0.5;
  });
      const nb = d.map(p => {
        const [bx, by, w, h] = p.bbox;
        const o = bears.find(b => !used.has(b) &&
          Math.hypot(b.x + b.w/2 - bx - w/2, b.y + b.h/2 - by - h/2) < Math.max(w, h, b.w, b.h) * .7);
        o && used.add(o);

        return {
          x: o ? o.x : bx, y: o ? o.y : by,
          w: o ? o.w : w, h: o ? o.h : h,
          tx: bx, ty: by, tw: w, th: h,
          pr: o ? o.pr : Math.random()*4|0,
          tb: o ? o.tb : Math.random() < .5 ? 1 : -1,
          t0: o ? o.t0 : now,
          ph: o ? o.ph : Math.random()*9,
          wv: o ? o.wv : null,
          sd: o ? o.sd : Math.random() < .5 ? 1 : -1,
          f: o && o.f, fh: o && o.fh, a: o && o.a, ah: o && o.ah,
          nb: o && o.nb || now + 800 + Math.random()*700,
          bs: o && o.bs || 0,
          seen: now
        };
      });

      bears = nb.concat(bears.filter(b => !used.has(b) && now - b.seen < 1200));
      bears.forEach(b => { if (b.wv == null) b.wv = !bears.some(o => o.wv); });
      nb.forEach(feat);
    }
  } catch (e) {
    console.error('Teddy recognition failed; retrying', e);
    setTimeout(detect, 1000);
    return;
  }
  setTimeout(detect, 500);
}

const bl = d => {
  const q = d < 0 ? 0 : d < 160 ? d/160 : d < 280 ? 1 : Math.max(0, 1 - (d - 280)/220);
  return q * q * (3 - 2 * q);
};
const nextBlink = () => Math.random() < .15 ? 400 : 2000 + Math.random() * 4000;

const rel = b => b.a && {
  l: [(b.a.l[0] - b.x)/b.w, (b.a.l[1] - b.y)/b.h],
  r: [(b.a.r[0] - b.x)/b.w, (b.a.r[1] - b.y)/b.h],
  n: [(b.a.n[0] - b.x)/b.w, (b.a.n[1] - b.y)/b.h]
};

const ONLY_BLINK = 1;
const S = Math.sin;
const fc = document.createElement('canvas');
const fx = fc.getContext('2d', {willReadFrequently: true});

function feat(b) {
  const GW = 96, GH = 80, n = GW * GH;
  fc.width = GW; fc.height = GH;
  fx.drawImage(v, b.x, b.y, b.w, b.h * .6, 0, 0, GW, GH);
  const d = fx.getImageData(0, 0, GW, GH).data;
  const L = new Float32Array(n);
  const I = new Float64Array((GW + 1) * (GH + 1));
  let gm = 0;

  for (let i = 0; i < n; i++) {
    L[i] = d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11;
    gm += L[i];
  }
  gm /= n;

  for (let y = 0; y < GH; y++) {
    let row = 0;
    for (let x = 0; x < GW; x++) {
      row += L[y*GW + x];
      I[(y+1)*(GW+1) + x+1] = I[y*(GW+1) + x+1] + row;
    }
  }

  const dk = new Uint8Array(n);
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const x0 = Math.max(0, x-8), x1 = Math.min(GW, x+9);
      const y0 = Math.max(0, y-8), y1 = Math.min(GH, y+9);
      const m = (I[y1*(GW+1)+x1] - I[y0*(GW+1)+x1] - I[y1*(GW+1)+x0] + I[y0*(GW+1)+x0]) / ((x1-x0)*(y1-y0));
      const l = L[y*GW + x];
      if (l < m*.65 && l < gm*.8) dk[y*GW + x] = 1;
    }
  }

  const cp = [], lab = new Int32Array(n).fill(-1);
  for (let i = 0; i < n; i++) {
    if (dk[i] && lab[i] < 0) {
      const st = [i];
      lab[i] = cp.length;
      let a = 0, sx = 0, sy = 0, sl = 0;
      while (st.length) {
        const j = st.pop();
        const x = j % GW, y = (j / GW) | 0;
        a++; sx += x; sy += y; sl += L[j];
        for (const k of [j-1, j+1, j-GW, j+GW]) {
          if (k < 0 || k >= n || Math.abs(k % GW - x) > 1) continue;
          if (dk[k] && lab[k] < 0) {
            lab[k] = cp.length;
            st.push(k);
          }
        }
      }
      cp.push({a, x: sx/a, y: sy/a, l: sl/a});
    }
  }

  const big = cp.filter(c => c.a >= 3 && c.x > GW*.12 && c.x < GW*.88);
  let N = null, ns = 0;
  for (const c of big) {
    if (c.y < GH*.15 || c.y > GH*.78 || c.x < GW*.2 || c.x > GW*.8) continue;
    const s = c.a * (1 - Math.abs(c.x/GW - .5)*1.5);
    if (s > ns) { ns = s; N = c; }
  }

  const eyes = big.filter(c => c.a <= GW*GW*.035 && c.x > GW*.15 && c.x < GW*.85 && c.y > GH*.25 && c.y < GH*.78);
  let El = null, Er = null, bs = -1e9;

  for (const p of eyes) {
    for (const q of eyes) {
      if (p.x >= q.x) continue;
      const sep = q.x - p.x, dy = Math.abs(p.y - q.y);
      const ratio = Math.min(p.a, q.a) / Math.max(p.a, q.a);
      if (p.x > GW*.48 || q.x < GW*.52 || sep < GW*.14 || sep > GW*.5 || dy > GH*.15 || ratio < .25) continue;
      if (N && (p === N || q === N || (p.y+q.y)/2 > N.y || Math.abs((p.x+q.x)/2 - N.x) > GW*.1 || N.y - (p.y+q.y)/2 > sep*.7)) continue;
      const s = Math.min(p.a, q.a) - .5*Math.abs(p.a - q.a) - 2*dy - .35*Math.abs(sep - GW*.27) - .2*Math.abs((p.x+q.x)/2 - GW*.5) - 20*(p.l + q.l)/2 / gm;
      if (s > bs) { bs = s; El = p; Er = q; }
    }
  }

  if (!El || !Er) return;
  if (!N) N = {x: (El.x + Er.x)/2, y: (El.y + Er.y)/2, a: Math.min(El.a, Er.a)};

  const U = c => [(c.x + .5)/GW, (c.y + .5)/GH * .6];
  const f = {
    l: U(El), r: U(Er), n: U(N),
    e: Math.sqrt(Math.max(El.a, Er.a) / Math.PI) / GW
  };

  // Strong absolute pinning so lids stay glued to the black eyes
  const P = q => [b.x + q[0]*b.w, b.y + q[1]*b.h];
  if (b.tx != null && Math.hypot(b.tx - b.x, b.ty - b.y) > b.w * .12) b.ah = [];
  const AH = b.ah = (b.ah || []).concat([{l: P(f.l), r: P(f.r), n: P(f.n)}]).slice(-7);

  const md = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const o = {};
  for (const k of ['l', 'r', 'n']) {
    o[k] = [0, 1].map(z => md(AH.map(h => h[k][z])));
  }
  b.a = o;

  // Median filter on relative features
  const H = b.fh = (b.fh || []).concat([f]).slice(-11);
  if (H.length < 4) return;

  const m = {e: md(H.map(h => h.e))};
  for (const k of ['l', 'r', 'n']) {
    m[k] = [0, 1].map(z => md(H.map(h => h[k][z])));
  }

  if (!b.f) { b.f = m; return; }

  for (const k of ['l', 'r', 'n']) {
    for (const z of [0, 1]) b.f[k][z] += (m[k][z] - b.f[k][z]) * .25;
  }
  b.f.e += (m.e - b.f.e) * .25;
}

const FS = `
precision highp float;
uniform sampler2D T;
uniform vec2 Z;
uniform float MI;
uniform vec4 B[4], P[4], Q[4], EL[4], ER[4], N[4], DE[4];
uniform float DB;

void main() {
  vec2 p = vec2(gl_FragCoord.x, Z.y - gl_FragCoord.y);
  if (MI > 0.) p.x = Z.x - p.x;
  vec4 col = texture2D(T, p / Z);

  for (int i = 0; i < 4; i++) {
    if (P[i].x <= 0. || Q[i].z <= 0.) continue;

    float R = max(N[i].z, 2.5);

    for (int k = 0; k < 2; k++) {
      vec2 E = k == 0 ? EL[i].xy : ER[i].xy;

      float dist = length(p - E);
      float disc = 1. - smoothstep(R * 0.92, R * 1.05, dist);

      if (disc > 0.) {
        float yl = E.y - R + 2.15 * R * Q[i].z;
        float edge = smoothstep(yl - R * 0.07, yl + R * 0.07, p.y);
        float w = disc * (1. - edge);

        // Clone fur from around the eye
        vec2 up   = vec2(0.0, -R * 1.6);
        vec2 left = vec2(-R * 1.4, -R * 0.3);
        vec2 right= vec2( R * 1.4, -R * 0.3);
        vec2 up2  = vec2(0.0, -R * 2.2);

        vec4 fur = 0.28 * (
          texture2D(T, (p + up) / Z) +
          texture2D(T, (p + left) / Z) +
          texture2D(T, (p + right) / Z) +
          texture2D(T, (p + up2) / Z)
        );

        col = mix(col, fur, w);
      }
    }
  }

  if (DB > 0.) {
    for (int i = 0; i < 4; i++) {
      vec4 b = B[i];
      if (b.z < 3.) continue;
      float t = b.z * 0.006 + 2.;
      vec2 l = p - b.xy;
      if (l.x > -t && l.y > -t && l.x < b.z + t && l.y < b.w + t &&
         (abs(l.x) < t || abs(l.y) < t || abs(l.x - b.z) < t || abs(l.y - b.w) < t))
        col = vec4(0, 1, 0, 1);

      for (int k = 0; k < 2; k++) {
        vec2 E = k == 0 ? EL[i].xy : ER[i].xy;
        if (abs(length(p - E) - N[i].z) < t) col = vec4(1, 0, 0, 1);
      }
    }
  }

  gl_FragColor = col;
}`;

let draw = () => {}, glReady = false, glChecked = false, lastRender = 0;

try {
  if (gl) {
    const pr = gl.createProgram();
    const precision = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision ? 'highp' : 'mediump';

    [[gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p,0,1); }'],
     [gl.FRAGMENT_SHADER, FS.replace('precision highp float;', `precision ${precision} float;`)]
    ].forEach(([type, src]) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(pr, sh);
    });

    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
     [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
     [gl.TEXTURE_MIN_FILTER, gl.LINEAR],
     [gl.TEXTURE_MAG_FILTER, gl.LINEAR]
    ].forEach(([k, q]) => gl.texParameteri(gl.TEXTURE_2D, k, q));

    const U = n => gl.getUniformLocation(pr, n);
    const cl = q => Math.min(1, Math.max(0, q));

    draw = function () {
      if (!glReady) return;
      const t = performance.now();
      if (t - lastRender < 1000 / 30) {
        requestAnimationFrame(draw);
        return;
      }
      lastRender = t;

      if (v.videoWidth && (c.width !== v.videoWidth || c.height !== v.videoHeight)) {
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        bears = [];
      }

      for (const b of bears) {
        if (b.tx != null) {
          b.x += (b.tx - b.x) * .18;
          b.y += (b.ty - b.y) * .18;
          b.w += (b.tw - b.w) * .18;
          b.h += (b.th - b.h) * .18;
        }
      }

      if (v.readyState > 1 || v.complete) {
        gl.viewport(0, 0, c.width, c.height);
        if (texW !== c.width || texH !== c.height) {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, c.width, c.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
          texW = c.width; texH = c.height;
        }
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, v);

        const A = {B: [], P: [], Q: [], EL: [], ER: [], N: [], DE: []};

        for (let i = 0; i < 4; i++) {
          const b = bears[i];
          let a = 0;
          if (b) {
            const al = (t - b.t0) / 1e3;
            a = cl(al / .18);
            a = a * a * (3 - 2 * a);

            if (a) {
              const r = Math.max((b.f && b.f.e || .025) * b.w, 3.5);
              const f = rel(b) || b.f || {l: [.38,.25], r: [.62,.25], n: [.5,.36]};
              const X = u => face === 'user' ? c.width - (b.x + u * b.w) : b.x + u * b.w;
              const Y = w => b.y + w * b.h;

              if (t > (b.nb || 0)) {
                b.bs = t;
                b.nb = t + nextBlink();
              }

              A.B.push(face === 'user' ? c.width - b.x - b.w : b.x, b.y, b.w, b.h);
              A.P.push(a, 0, 0, 0);
              A.Q.push(0, 0, a * bl(t - b.bs), 0);
              A.DE.push(X(f.l[0]), Y(f.l[1]), X(f.r[0]), Y(f.r[1]));
              A.EL.push(X(f.l[0]), Y(f.l[1]), 0, 0);
              A.ER.push(X(f.r[0]), Y(f.r[1]), 0, 0);
              A.N.push(X(f.n[0]), Y(f.n[1]), r, 0);
              continue;
            }
          }
          for (const z in A) A[z].push(0, 0, 1, 1);
        }

        for (const z in A) gl.uniform4fv(U(z), A[z]);
        gl.uniform2f(U('Z'), c.width, c.height);
        gl.uniform1f(U('DB'), dbg ? 1 : 0);
        gl.uniform1f(U('MI'), face === 'user' ? 1 : 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        if (!glChecked) {
          glChecked = true;
          const e = gl.getError();
          if (e !== gl.NO_ERROR) {
            console.error('WebGL camera rendering failed', e);
            useFallback();
          }
        }
      }
      requestAnimationFrame(draw);
    };
    glReady = true;
  }
} catch (e) {
  console.error('WebGL renderer unavailable', e);
}

const fctx = fcam.getContext('2d');
const patch = document.createElement('canvas');
const patchCtx = patch.getContext('2d', {willReadFrequently: true});
patch.width = patch.height = 24;
let fallbackActive = false;

function useFallback() {
  if (fallbackActive) return;
  glReady = false;
  c.style.display = 'none';
  fcam.style.display = 'block';
  fallbackActive = true;
  fallbackDraw();
}

function fallbackDraw() {
  if (!fallbackActive) return;
  const w = v.videoWidth, h = v.videoHeight, t = performance.now();
  if (t - lastRender < 1000 / 30) {
    requestAnimationFrame(fallbackDraw);
    return;
  }
  lastRender = t;
  if (w && h) {
    if (fcam.width !== w || fcam.height !== h) {
      fcam.width = w; fcam.height = h;
    }
    for (const b of bears) {
      if (b.tx != null) {
        b.x += (b.tx - b.x) * .18;
        b.y += (b.ty - b.y) * .18;
        b.w += (b.tw - b.w) * .18;
        b.h += (b.th - b.h) * .18;
      }
    }

    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, w, h);
    fctx.save();
    if (face === 'user') {
      fctx.translate(w, 0);
      fctx.scale(-1, 1);
    }
    fctx.drawImage(v, 0, 0, w, h);

    for (const b of bears) {
      if (t > (b.nb || 0)) {
        b.bs = t;
        b.nb = t + nextBlink();
      }
      const age = (t - b.t0) / 1000;
      const blink = Math.min(1, Math.max(0, age / .18)) * bl(t - b.bs);
      if (blink < .05) continue;

      const faceFeatures = Object.assign({e: .025}, b.f, rel(b));
      const r = Math.max((faceFeatures.e || .025) * b.w, 3.5);

      for (const eye of [faceFeatures.l, faceFeatures.r]) {
        const x = b.x + eye[0] * b.w;
        const y = b.y + eye[1] * b.h;

        patchCtx.drawImage(v, x - r*2.5, y - r*3.2, r*5, r*5, 0, 0, 24, 24);
        const d = patchCtx.getImageData(0, 0, 24, 24).data;
        let rr = 0, gg = 0, bb = 0, n = 0;
        for (let i = 0; i < 576; i++) {
          const dx = i % 24 - 11.5, dy = (i / 24 | 0) - 11.5;
          const q = dx*dx + dy*dy;
          if (q > 30 && q < 90) {
            rr += d[i*4]; gg += d[i*4+1]; bb += d[i*4+2]; n++;
          }
        }
        if (n < 8) continue;

        fctx.fillStyle = `rgb(${rr/n|0},${gg/n|0},${bb/n|0})`;
        fctx.beginPath();
        fctx.ellipse(x, y, r * 1.02, r * 1.05 * blink, 0, 0, Math.PI * 2);
        fctx.fill();
      }
    }
    fctx.restore();
  }
  requestAnimationFrame(fallbackDraw);
}

c.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  useFallback();
});

document.addEventListener('pointerdown', () => {
  const d = document.documentElement;
  document.fullscreenElement || d.requestFullscreen?.({navigationUI: 'hide'}).catch(() => {});
});

navigator.serviceWorker && navigator.serviceWorker.register('sw.js');

async function start() {
  try {
    if (!window.isSecureContext) throw new Error('Camera access requires HTTPS or localhost');
    await cam();
    if (glReady) draw();
    else useFallback();
    m = await cocoSsd.load();
    detect();
  } catch (e) {
    console.error('Could not start teddy camera', e);
    tm.textContent = !window.isSecureContext
      ? 'Open the HTTPS link to use the camera.'
      : e.name === 'NotAllowedError'
        ? 'Allow camera access, then reload.'
        : 'Could not start camera. Check camera permission and reload.';
    tm.style.background = '#000b';
    tm.style.display = 'block';
  }
}
start();
</script>
