<script>

s.onclick=async()=>{if(mode=='PHOTO'){last=c.toDataURL('image/jpeg',.92);ext='jpg';thumb();c.style.opacity=0;setTimeout(()=>c.style.opacity=1,80);return}

const ms=c.captureStream(30),au=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null);au&&au.getTracks().forEach(t=>ms.addTrack(t));const mt=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));

s.style.borderRadius='22px';s.style.transform='scale(.7)';const t0=Date.now();tm.style.display='block';tm.textContent='00:00';ti=setInterval(()=>{const q=(Date.now()-t0)/1e3|0;tm.textContent=String(q/60|0).padStart(2,0)+':'+String(q%60).padStart(2,0)},500)};
g.onclick=()=>{if(!last)return;const a=document.createElement('a');a.download=(ext=='jpg'?'IMG_':'VID_')+Date.now()+'.'+ext;a.href=last;a.click()};
async function detect(){if(m&&v.readyState>1){const now=performance.now(),d=(await m.detect(v,20,.35)).filter(p=>p.class=='teddy bear'),used=new Set;
const nb=d.map(p=>{const[bx,by,w,h]=p.bbox,o=bears.find(b=>!used.has(b)&&Math.hypot(b.x+b.w/2-bx-w/2,b.y+b.h/2-by-h/2)<w/2);o&&used.add(o);const L=(q,n)=>o?o[q]*.7+n*.3:n;
return{x:L('x',bx),y:L('y',by),w:L('w',w),h:L('h',h),t0:o?o.t0:now+Math.random()*500,ph:o?o.ph:Math.random()*9,wv:o?o.wv:null,sd:o?o.sd:Math.random()<.5?1:-1,f:o&&o.f,nb:o&&o.nb,bs:o&&o.bs,seen:now}});
bears=nb.concat(bears.filter(b=>!used.has(b)&&now-b.seen<1200));bears.forEach(b=>{if(b.wv==null)b.wv=!bears.some(o=>o.wv)&&Math.random()<.7});nb.forEach(feat)}setTimeout(detect,250)}
const S=Math.sin,fc=document.createElement('canvas'),fx=fc.getContext('2d',{willReadFrequently:true});fc.width=48;fc.height=40;
function feat(b){fx.drawImage(v,b.x,b.y,b.w,b.h*.6,0,0,48,40);const d=fx.getImageData(0,0,48,40).data,L=new Float32Array(1920),D=new Float32Array(1920),pk=[];
for(let i=0;i<1920;i++)L[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
for(let j=0;j<40;j++)for(let i=0;i<48;i++){let s=0,n=0;for(let y=Math.max(0,j-5);y<Math.min(40,j+6);y++)for(let z=Math.max(0,i-5);z<Math.min(48,i+6);z++){s+=L[y*48+z];n++}D[j*48+i]=s/n-L[j*48+i]}
for(let j=1;j<39;j++)for(let i=1;i<47;i++){const q=D[j*48+i];if(q<15)continue;let mx=1;for(let y=-3;y<=3;y++)for(let z=-3;z<=3;z++){const yy=j+y,xx=i+z;if(yy>=0&&yy<40&&xx>=0&&xx<48&&D[yy*48+xx]>q)mx=0}if(mx&&i>7&&i<41&&j>5)pk.push([(i+.5)/48,(j+.5)/40*.6,q])}
pk.sort((a,b)=>b[2]-a[2]);pk.length=Math.min(pk.length,8);let E=null,s0=0,N=null;
for(const p of pk)for(const q of pk){const dx=q[0]-p[0];if(dx>.1&&dx<.45&&Math.abs(q[1]-p[1])<.09&&p[2]+q[2]>s0){s0=p[2]+q[2];E=[p,q]}}
if(E){const mx=(E[0][0]+E[1][0])/2,my=Math.max(E[0][1],E[1][1]);let bs=0;for(const p of pk){const s=p[2]*(1-3*(Math.abs(p[0]-mx)+Math.abs(p[1]-my-.09)));if(p!=E[0]&&p!=E[1]&&p[1]>my+.02&&s>bs){bs=s;N=p}}N=N||[mx,my+.1]}
const f=E?{l:E[0].slice(0,2),r:E[1].slice(0,2),n:N.slice(0,2)}:{l:[.38,.25],r:[.62,.25],n:[.5,.36]};
if(!b.f)b.f=f;else for(const k of['l','r','n'])for(const z of[0,1])b.f[k][z]+=(f[k][z]-b.f[k][z])*.5}
function nz(k,s){const i=Math.floor(k),f=k-i,h=n=>{const q=S((n+s)*127.1)*43758.5;return q-Math.floor(q)-.5},g=f*f*(3-2*f);return h(i)*(1-g)+h(i+1)*g}
const FS=`precision highp float;uniform sampler2D T;uniform vec2 Z;uniform float MI;uniform vec4 B[4],P[4],Q[4],EL[4],ER[4],N[4];
vec2 rot(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
void main(){vec2 p=vec2(gl_FragCoord.x,Z.y-gl_FragCoord.y);if(MI>0.)p.x=Z.x-p.x;vec2 q=p;
for(int i=0;i<4;i++){float a=P[i].x;if(a<=0.)continue;vec4 b=B[i];vec2 l=(q-b.xy)/b.zw,g=(l+.3)/1.6;
if(g.x<=0.||g.x>=1.||g.y<=0.||g.y>=1.)continue;float e=sin(3.1416*g.x)*sin(3.1416*g.y);
float bw=e*exp(-(pow((l.x-.5)/.7,2.)+pow((l.y-.5)/.8,2.)));vec2 c=b.xy+b.zw*vec2(.5,.85);q=c+(q-c)/(1.+bw*P[i].z);
l=(q-b.xy)/b.zw;float hw=bw*clamp((.55-l.y)/.3,0.,1.);vec2 pv=b.xy+b.zw*vec2(.5,.5);q=pv+rot(q-pv,-hw*P[i].y);q.x-=hw*P[i].w*b.z*.04;vec2 n=N[i].xy;q=n+(q-n)/(1.+hw*.05*a);
l=(q-b.xy)/b.zw;float sd=Q[i].w,dd=(1.-smoothstep(.1,.19,length((l-vec2(.5+sd*.37,.6))*vec2(1.,.8))));vec2 sh=b.xy+b.zw*vec2(.5+sd*.24,.44);q=sh+rot(q-sh,sd*Q[i].y*e*dd);
float r=N[i].z;for(int k=0;k<2;k++){vec2 E=k==0?EL[i].xy:ER[i].xy;float m=(1.-smoothstep(r*1.1,r*2.2,length(q-E)));q-=m*EL[i].zw;float yl=E.y+r*.6;q.y-=Q[i].z*m*(1.-smoothstep(yl-r*.2,yl+r*.3,q.y))*r*2.;}
vec2 dm=q-n-vec2(0.,b.w*.07);float mo=exp(-(pow(dm.x/(b.z*.14),2.)+pow(dm.y/(b.w*.06),2.)));q.y+=Q[i].x*mo*b.w*.04*clamp(pow(dm.x/(b.z*.07),2.),0.,1.);
vec2 dn=q-n;q=n+dn/(1.+N[i].w*(1.-smoothstep(r*1.2,r*3.,length(dn))));}
gl_FragColor=texture2D(T,q/Z);}`;
const pr=gl.createProgram();[[gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'],[gl.FRAGMENT_SHADER,FS]].forEach(([y,s])=>{const h=gl.createShader(y);gl.shaderSource(h,s);gl.compileShader(h);if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(h));gl.attachShader(pr,h)});
gl.linkProgram(pr);gl.useProgram(pr);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([k,q])=>gl.texParameteri(gl.TEXTURE_2D,k,q));
const U=n=>gl.getUniformLocation(pr,n),cl=q=>Math.min(1,Math.max(0,q));
function draw(){const t=performance.now();if(v.readyState>1||v.complete){gl.viewport(0,0,c.width,c.height);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);
const A={B:[],P:[],Q:[],EL:[],ER:[],N:[]};for(let i=0;i<4;i++){const b=bears[i];let a=0;if(b){const al=(t-b.t0)/1e3,k=t/1e3+b.ph;a=cl((al-1)/.8);a=a*a*(3-2*a);
if(a){const pk=Math.exp(-(((al-1.5)/.35)**2)),lk=a*Math.sign(c.width/2-b.x-b.w/2),r=b.w*.03,f=b.f||{l:[.38,.25],r:[.62,.25],n:[.5,.36]},X=u=>b.x+u*b.w,Y=w=>b.y+w*b.h;
let up=b.wv&&al>2?cl((nz(al*.3,b.ph+20)-.08)*7):0;up=a*up*up*(3-2*up);if(t>(b.nb||0)){b.bs=t;b.nb=t+2e3+Math.random()*4e3}
A.B.push(b.x,b.y,b.w,b.h);A.P.push(a,a*(.02+.22*nz(k*.45,b.ph)),a*(.05+.04*nz(k*.3,b.ph+7)+.008*S(k*2.4))+.06*pk,lk);
A.Q.push(a*cl((nz(al*.25,b.ph+30)+.25)*4),up*(1.05+.35*S(al*11)),a*Math.max(0,1-Math.abs(t-b.bs-90)/90),b.sd);
A.EL.push(X(f.l[0]),Y(f.l[1]),lk*r*.35,0);A.ER.push(X(f.r[0]),Y(f.r[1]),0,0);A.N.push(X(f.n[0]),Y(f.n[1]),r,a*(nz(al*.5,b.ph+40)>.15?.08*S(al*25)**2:0));continue}}
for(const z in A)A[z].push(0,0,1,1)}for(const z in A)gl.uniform4fv(U(z),A[z]);gl.uniform2f(U('Z'),c.width,c.height);gl.uniform1f(U('MI'),face=='user'?1:0);gl.drawArrays(gl.TRIANGLES,0,3)}
requestAnimationFrame(draw)}
document.addEventListener("pointerdown",()=>{const d=document.documentElement;document.fullscreenElement||d.requestFullscreen?.({navigationUI:"hide"}).catch(()=>{})});
cam().then(async()=>{draw();m=await cocoSsd.load();detect()});
</script>
