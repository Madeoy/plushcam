<!doctype html><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><meta name=theme-color content="#000"><title>Camera</title><link rel=manifest href=manifest.json><link rel=apple-touch-icon href=icon192.png><meta name=mobile-web-app-capable content=yes>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;height:100svh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#top{display:flex;justify-content:space-around;align-items:center;height:56px;font-size:20px;opacity:.95}
#pv{position:relative;width:100vw;aspect-ratio:3/4}canvas{width:100%;height:100%;object-fit:cover;display:block}video{display:none}
#z{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0006;border-radius:30px;padding:4px}
#z b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500}#z b.on{background:#0009;color:#fd0;width:42px;height:42px;font-size:13px}
#m{display:flex;justify-content:center;gap:22px;font-size:14px;font-weight:600;margin:18px 0 auto;color:#ccc}#m .on{color:#fff;background:#fff3;padding:5px 14px;border-radius:20px;margin:-5px 0}
#b{display:flex;justify-content:space-between;align-items:center;padding:0 34px 34px}
#g{width:48px;height:48px;border-radius:50%;background:#333 center/cover;border:2px solid #fff3}
#s{width:76px;height:76px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px #000,0 0 0 7px #fff}#s:active{transform:scale(.92)}
#f{width:48px;height:48px;border-radius:50%;background:#fff2;border:0;color:#fff;font-size:24px}</style>
<div id=top><span>⚙︎</span><span>ϟ</span><span>◷</span><span style="font-size:13px;border:1.5px solid #fff;border-radius:4px;padding:1px 4px">3:4</span><span>✦</span></div>
<div id=pv><video id=v playsinline muted></video><canvas id=c></canvas><div id=tm style="position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#e22;padding:3px 10px;border-radius:12px;font-size:14px;display:none"></div><div id=z><b>.6</b><b class=on>1x</b><b>3</b></div></div>
<div id=m><span>MORE</span><span>PORTRAIT</span><span class=on>PHOTO</span><span>VIDEO</span></div>
<div id=b><div id=g></div><button id=s></button><button id=f>⟲</button></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');let m,face='environment',bears=[],st,last,mode='PHOTO',rec,ext='jpg',ti;
async function cam(){st&&st.getTracks().forEach(t=>t.stop());const vc={facingMode:face,width:1440,height:1920};st=await navigator.mediaDevices.getUserMedia({video:vc});v.srcObject=st;await v.play();c.width=v.videoWidth;c.height=v.videoHeight}
f.onclick=()=>{face=face=='user'?'environment':'user';cam()};
z.onclick=e=>{if(e.target.tagName=='B'){z.querySelector('.on').className='';e.target.className='on'}};
const M=document.getElementById('m');M.onclick=e=>{const t=e.target.textContent;if(rec||!/PHOTO|VIDEO/.test(t))return;mode=t;M.querySelector('.on').className='';e.target.className='on';s.style.background=t=='VIDEO'?'#e33':'#fff'};
const thumb=()=>g.style.backgroundImage=`url(${c.toDataURL('image/jpeg',.5)})`;
s.onclick=async()=>{if(mode=='PHOTO'){last=c.toDataURL('image/jpeg',.92);ext='jpg';thumb();c.style.opacity=0;setTimeout(()=>c.style.opacity=1,80);return}
if(rec){rec.stop();rec=null;s.style.borderRadius='50%';s.style.transform='';tm.style.display='none';clearInterval(ti);return}
const ms=c.captureStream(30),au=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null);au&&au.getTracks().forEach(t=>ms.addTrack(t));const mt=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
const ch=[],r=rec=new MediaRecorder(ms,{mimeType:mt});r.ondataavailable=e=>ch.push(e.data);r.onstop=()=>{au&&au.getTracks().forEach(t=>t.stop());last=URL.createObjectURL(new Blob(ch,{type:mt}));ext=mt.slice(6);thumb()};r.start();
s.style.borderRadius='22px';s.style.transform='scale(.7)';const t0=Date.now();tm.style.display='block';tm.textContent='00:00';ti=setInterval(()=>{const q=(Date.now()-t0)/1e3|0;tm.textContent=String(q/60|0).padStart(2,0)+':'+String(q%60).padStart(2,0)},500)};
g.onclick=()=>{if(!last)return;const a=document.createElement('a');a.download=(ext=='jpg'?'IMG_':'VID_')+Date.now()+'.'+ext;a.href=last;a.click()};
async function detect(){if(m&&v.readyState>1){const now=performance.now(),d=(await m.detect(v,20,.35)).filter(p=>p.class=='teddy bear'),used=new Set;
const nb=d.map(p=>{const[bx,by,w,h]=p.bbox,o=bears.find(b=>!used.has(b)&&Math.hypot(b.x+b.w/2-bx-w/2,b.y+b.h/2-by-h/2)<w/2);o&&used.add(o);const L=(q,n)=>o?o[q]*.7+n*.3:n;return{x:L('x',bx),y:L('y',by),w:L('w',w),h:L('h',h),t0:o?o.t0:now+Math.random()*500,ph:o?o.ph:Math.random()*9,seen:now}});
bears=nb.concat(bears.filter(b=>!used.has(b)&&now-b.seen<1200))}setTimeout(detect,250)}
const N=8,S=Math.sin,PI=Math.PI;
function tri(s,d){const cx=(d[0]+d[2]+d[4])/3,cy=(d[1]+d[3]+d[5])/3;x.save();x.beginPath();
for(let i=0;i<3;i++){const px=d[2*i]+(d[2*i]-cx)*.05,py=d[2*i+1]+(d[2*i+1]-cy)*.05;i?x.lineTo(px,py):x.moveTo(px,py)}x.clip();
const[s0,t0,s1,t1,s2,t2]=s,[d0,e0,d1,e1,d2,e2]=d,q=(s1-s0)*(t2-t0)-(s2-s0)*(t1-t0);
const A=((d1-d0)*(t2-t0)-(d2-d0)*(t1-t0))/q,C=((d2-d0)*(s1-s0)-(d1-d0)*(s2-s0))/q,B=((e1-e0)*(t2-t0)-(e2-e0)*(t1-t0))/q,D=((e2-e0)*(s1-s0)-(e1-e0)*(s2-s0))/q;
x.transform(A,B,C,D,d0-A*s0-C*t0,e0-B*s0-D*t0);const mx=Math.min(s0,s1,s2)-4,my=Math.min(t0,t1,t2)-4,W=Math.max(s0,s1,s2)+4-mx,H=Math.max(t0,t1,t2)+4-my;
x.drawImage(v,mx,my,W,H,mx,my,W,H);x.restore()}
function warp(b,a,k,pk){const P=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const u=i/N,w=j/N,sx=b.x+u*b.w,sy=b.y+w*b.h,e=S(PI*u)*S(PI*w);
let qx=(u-.5)*b.w,qy=(w-.75)*b.h,sc=e*a*(.06+.012*S(k*2.6)),dx=qx*sc,dy=qy*sc-e*b.h*.05*pk;
const hw=e*Math.min(1,Math.max(0,(.62-w)/.35)),th=a*hw*(.09*S(k*.8)+.04);qy=(w-.6)*b.h;
dx+=qx*(Math.cos(th)-1)-qy*S(th)+a*e*b.w*.018*S(k*1.1);dy+=qx*S(th)+qy*(Math.cos(th)-1)+a*hw*b.h*.015*S(k*1.7);P.push([sx,sy,sx+dx,sy+dy])}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const p=P[j*(N+1)+i],r=P[j*(N+1)+i+1],l=P[(j+1)*(N+1)+i],z=P[(j+1)*(N+1)+i+1];
tri([p[0],p[1],r[0],r[1],l[0],l[1]],[p[2],p[3],r[2],r[3],l[2],l[3]]);tri([r[0],r[1],z[0],z[1],l[0],l[1]],[r[2],r[3],z[2],z[3],l[2],l[3]])}}
function draw(){const t=performance.now();x.save();if(face=='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);
for(const b of bears){let a=Math.min(1,Math.max(0,(t-b.t0-1000)/800));a=a*a*(3-2*a);if(a)warp(b,a,t/1000+b.ph,Math.exp(-(((t-b.t0-1500)/350)**2)))}
x.restore();requestAnimationFrame(draw)}
document.addEventListener("pointerdown",()=>{const d=document.documentElement;document.fullscreenElement||d.requestFullscreen?.({navigationUI:"hide"}).catch(()=>{})});
cam().then(async()=>{draw();m=await cocoSsd.load();detect()});
</script>
